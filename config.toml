# 复读插件配置
# 字段含义与取值范围见 config.py，术语见 CONTEXT.md。

[plugin]
enabled = true
config_version = "1.4.0"

# 协议端 HTTP 上报的接收端点。协议端需要新增一个 HTTP 上报目标指向这里
# （好友申请插件已占 18080，本插件默认 18081）。
[webhook]
host = "0.0.0.0"
port = 18081
path = "/maibot/emoji_reaction"
secret = ""

# 贴表情动作直调协议端 OneBot HTTP。base_url 不填则插件不做任何动作。
[protocol]
base_url = ""
access_token = ""
# 留空则启动时用 get_login_info 自动获取
self_qq = ""

# 回应骰：两套概率分别对应「他人的消息」和「麦麦自己的消息」，决定是否回应；
# 回应后命中反义映射的表情 ID 再掷反义骰决定贴反义回应还是同款。
[bandwagon]
probability = 0.25
self_message_probability = 0.12

# 反义骰。回应骰掷中后，命中反义映射的表情按本概率贴相反表情，
# 掷不中贴同款（回落跟风）；填 0 则从不唱反调。
[opposite]
enabled = true
probability = 0.35
include_defaults = true
# 追加或覆盖反义对，写法 "A=B"，可用 emoji 字符或协议端表情编号
extra_pairs = []
# 这些表情所在的反义对整对移除，使它们回落到跟风分支
disabled_emojis = []

# 复读：链达标后掷骰一次，三个出口权重就是这一次掷骰的三个面，按比例恰好命中一个出口——
# 把复读文本原样发出 / 发打断文本 / 沉默；与跟风、反义回应的概率骰互不影响
[repeat]
enabled = true
# 滚动窗口秒数，窗口外的历史消息随滚动失效
window_seconds = 120
# 窗口内计数达到该值时链达标，取得一次决策资格
threshold = 3
# 仅计不同发送者人头；关闭后逐条消息计数
distinct_senders = true
# 三个出口权重：一次掷骰的三个面（复读 / 打断 / 沉默），按比例选中恰好一个。
# 默认 85 / 15 / 0 = 85% 复读、15% 打断、从不沉默；只有比例意义，同比例放大等价
weight_repeat = 85
weight_interrupt = 15
weight_silence = 0
# 打断出口的变体池，每次随机一条；全部留空回落内置默认池
interrupt_texts = ["打断！", "够了！", "停！", "打住！", "别念了！"]
# 复读 / 打断出口命中后发送前的随机等待区间（秒），与 [behavior] 里表情回应的延迟互相独立
delay_min_seconds = 0.3
delay_max_seconds = 1.5
# 掷骰后（含沉默出口）同文本在此时长内不再触发新一轮，0 = 不做链终结
chain_ttl_seconds = 1800
# 复读专用群冷却，与 [behavior] 里表情回应的冷却互相独立，0 = 不限
cooldown_seconds = 120
# 超过此长度的文本不参与复读链，0 = 不限
max_text_length = 200
# 内存中复读链条数上界，超出后丢弃最旧的链
max_chains = 2000

[behavior]
# 同一个群两次贴表情的最小间隔，0 = 不限
cooldown_seconds = 60
# 决定贴表情后的随机等待区间，避免瞬间贴上显得机械
delay_min_seconds = 1.0
delay_max_seconds = 6.0
# 「这条消息已贴过」的记忆时长与条数上界
slot_ttl_seconds = 3600
max_slots = 2000

# 上下文注入（实验性，默认关闭）。开启后表情回应去重、聚合后注入聊天历史，
# 同时拦截主程序消息链上的表情回应通知消息。
[context]
enabled = false
# 同一（回应者、被回应消息、表情）组合在此窗口内只注入一次，0 = 不启用去重
dedup_ttl_seconds = 3600
# 同一被回应消息同一表情的多条回应在此窗口内汇入同一条注入消息
merge_window_seconds = 30
# 单条被回应消息最多产生的注入消息条数
max_reactions_per_message = 10
# 麦麦自己的显示名；留空自动取主程序 bot.nickname，再取不到则不写名字
self_display_name = ""

[scope]
# 留空 = 除黑名单外所有群生效
group_whitelist = []
group_blacklist = []
# 忽略这些 QQ 贴出的表情回应，通常填其他机器人
ignore_reactors = []
# 忽略这些 QQ 发出的消息（不进复读链），与上面的回应者名单是两个概念
ignore_senders = []

# 跨群转发（默认关闭）。源群出现合并转发后，每个目标群独立掷一次骰决定是否自动转发；
# 转发域不复用上面的 [scope] 白黑名单，源群与目标群各自由本段列表指定。
[forward]
# 转发域总开关，默认关闭 = 装了但不动
enabled = false
# 只处理这些群里的合并转发；留空则没有源群
source_groups = []
# 自动转发的候选目标群，列表顺序即投递顺序；与源群相同的项被跳过
target_groups = []
# 每个目标群独立掷骰的两个权重（转发 / 沉默），按比例恰好命中一个。
# 默认 30 / 70 = 30% 转发；只有比例意义，同比例放大等价；两权重全 0 视为沉默不掷骰
weight_send = 30
weight_silence = 70
# 同一条转发源消息在此窗口内只参与一次掷骰，0 = 不防重
dedup_ttl_seconds = 1800
# 源群冷却：至少一个目标群命中转发后写入，冷却期内该群新到的合并转发不掷骰；全沉默不写冷却，0 = 不限
cooldown_seconds = 60
# 目标群冷却：该群命中转发后写入，冷却期内不再参与掷骰；与源群冷却分开计时，0 = 不限
target_cooldown_seconds = 60
# 命中转发后发送前的随机等待区间（秒），与 [repeat]、[behavior] 两域延迟互相独立
delay_min_seconds = 0.5
delay_max_seconds = 2.0
# 自动转发投递成功后是否触发目标群 Planner 针对该转发发言（软约束，Planner 仍可沉默）
trigger_target_planner = true
# 转发内容注入文本的长度上限，超长按上限截断并带省略标记
inject_max_chars = 800
# 转发模式：direct = 掷骰命中即直发目标群（默认，升级后行为不变）；
# planner = 命中后把富摘要交给目标群 Planner 决策是否转发，经决策 Tool 回路执行
mode = "direct"
# 自动转发路径开关：关闭后源群合并转发不再掷骰、不投递，请求转发路径不受影响
auto_enabled = true
# 请求转发路径开关：关闭后转发 Tool 与源群 Planner 入口提示不再生效，自动转发路径不受影响
request_enabled = true
# 等待转发卡片摘要就绪的上限（秒）：超时仍未就绪则记 warning 并放弃本次，不掷骰、不写冷却、不投递
summary_timeout_seconds = 10