# 表情跟风插件配置
# 字段含义与取值范围见 config.py，术语见 CONTEXT.md。

[plugin]
enabled = true
config_version = "1.0.0"

# 协议端 HTTP 上报的接收端点。协议端需要新增一个 HTTP 上报目标指向这里
# （好友申请插件已占 18080，本插件默认 18081）。
[webhook]
host = "0.0.0.0"
port = 18081
path = "/maibot/emoji_reaction"
secret = ""

# 贴表情动作直调协议端 OneBot HTTP。base_url 不填则插件不做任何动作。
[protocol]
base_url = ""
access_token = ""
# 留空则启动时用 get_login_info 自动获取
self_qq = ""

# 回应概率（第一颗骰子）。两套概率分别对应「他人的消息」和「麦麦自己的消息」，
# 决定是否回应；回应后命中反义映射的表情再掷反义概率决定贴反义还是同款。
[bandwagon]
probability = 0.25
self_message_probability = 0.12

# 反义回应（第二颗骰子）。回应骰掷中后，命中反义映射的表情按本概率贴相反表情，
# 掷不中贴同款（回落跟风）；填 0 则从不唱反调。
[opposite]
enabled = true
probability = 0.35
include_defaults = true
# 追加或覆盖反义对，写法 "A=B"，可用 emoji 字符或协议端表情编号
extra_pairs = []
# 这些表情所在的反义对整对移除，使它们回落到跟风分支
disabled_emojis = []

[behavior]
# 同一个群两次贴表情的最小间隔，0 = 不限
cooldown_seconds = 60
# 决定贴表情后的随机等待区间，避免瞬间贴上显得机械
delay_min_seconds = 1.0
delay_max_seconds = 6.0
# 「这条消息已贴过」的记忆时长与条数上界
slot_ttl_seconds = 3600
max_slots = 2000

# 上下文注入（实验性，默认关闭）。开启后表情回应去重、聚合后注入聊天历史，
# 同时拦截主程序消息链上的表情回应通知消息。
[context]
enabled = false
# 同一（回应者、被回应消息、表情）组合在此窗口内只注入一次
dedup_ttl_seconds = 3600
# 同一被回应消息同一表情的多条回应在此窗口内汇入同一条注入消息
merge_window_seconds = 30
# 单条被回应消息最多产生的注入消息条数
max_reactions_per_message = 10
# 麦麦自己的显示名；留空自动取主程序 bot.nickname，再取不到则不写名字
self_display_name = ""

[scope]
# 留空 = 除黑名单外所有群生效
group_whitelist = []
group_blacklist = []
# 忽略这些 QQ 贴出的表情回应，通常填其他机器人
ignore_reactors = []